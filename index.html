<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SLIIT FOSS Leaderboard</title>
    <meta
      name="description"
      content="Top GitHub contributors to SLIIT FOSS. Every merged pull request to a sliit-foss repository earns 10 points."
    />
    <meta name="author" content="SLIIT FOSS Community" />
    <meta name="theme-color" content="#656BFE" />
    <link rel="icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/banner.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:title" content="SLIIT FOSS Leaderboard" />
    <meta
      property="og:description"
      content="Top GitHub contributors to SLIIT FOSS. 1 merged PR = 10 points."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://leaderboard.sliitfoss.org/" />
    <meta
      property="og:image"
      content="https://leaderboard.sliitfoss.org/banner.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1034" />
    <meta property="og:image:height" content="397" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700;800&display=swap"
    />
    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to view the leaderboard.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
